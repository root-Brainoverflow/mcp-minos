[project]
name = "mcp-security-analyzer"
version = "0.1.0"
description = "Pre-deployment security scanner for MCP servers — static analysis + sandboxed runtime inspection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "docker>=7.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "mcp>=1.0",
    "aiofiles>=24.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "psutil>=5.9",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1",
]

[project.scripts]
# `minos` — the dynamic-analysis CLI (click group: discover / static / dynamic / scan / analyze).
minos = "mcp_security_analyzer.dynamic.cli:main"
# `minos-api` — start the FastAPI read-API (uvicorn) the web frontend talks to.
minos-api = "mcp_security_analyzer.api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_security_analyzer"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
